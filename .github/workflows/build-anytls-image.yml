name: Build AnyTLS Node Image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/anytls-singbox-mvp

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=node-anytls-amd64
          cache-to: type=gha,mode=max,scope=node-anytls-amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/node:anytls-singbox-mvp
            ghcr.io/${{ github.repository_owner }}/node:anytls-${{ github.sha }}
